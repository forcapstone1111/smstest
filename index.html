<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Gateway</title>
  <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>SMS Gateway</span>
      </div>
      <ul class="sidebar-nav">
        <li><a href="#" class="sidebar-link active" data-page="send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Send SMS
        </a></li>
        <li><a href="#" class="sidebar-link" data-page="settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a></li>
      </ul>
      <div class="sidebar-footer">
        <span id="sidebarStatus" class="status-dot"></span>
        <span id="sidebarStatusText">Not connected</span>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Send SMS Page -->
      <div id="page-send" class="page active">
        <div class="page-header">
          <h1>Send SMS</h1>
          <p>Send messages via local or online gateway</p>
        </div>

        <div class="card">
          <div class="card-body">
            <!-- Endpoint Selector -->
            <div class="mb-4">
              <label class="form-label">Endpoint</label>
              <div class="endpoint-toggle">
                <button type="button" class="btn endpoint-btn active" data-endpoint="local">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                  Local
                </button>
                <button type="button" class="btn endpoint-btn" data-endpoint="online">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                  Online
                </button>
              </div>
            </div>

            <!-- Phone Number -->
            <div class="mb-3">
              <label for="phoneInput" class="form-label">Phone Number(s)</label>
              <input type="text" class="form-control" id="phoneInput" placeholder="09123456789, 09223334444">
              <div class="form-text">Separate multiple numbers with commas</div>
            </div>

            <!-- Message -->
            <div class="mb-3">
              <label for="messageInput" class="form-label">Message</label>
              <textarea class="form-control" id="messageInput" rows="4" placeholder="Type your message..." maxlength="1600"></textarea>
              <div class="d-flex justify-content-between">
                <div class="form-text">Max 1600 characters</div>
                <div class="form-text"><span id="charCount">0</span>/1600</div>
              </div>
            </div>

            <!-- Send Button -->
            <button type="button" class="btn btn-primary w-100" id="sendBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              Send SMS
            </button>

            <!-- Response -->
            <div id="responseArea" class="mt-3" style="display:none;">
              <div class="alert" id="responseAlert" role="alert"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Settings Page -->
      <div id="page-settings" class="page">
        <div class="page-header">
          <h1>Settings</h1>
          <p>Configure your SMS gateway endpoints</p>
        </div>

        <!-- Local Endpoint -->
        <div class="card mb-3">
          <div class="card-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
            Local Endpoint
          </div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-9">
                <label for="localIp" class="form-label">Local Endpoint</label>
                <input type="text" class="form-control" id="localIp" placeholder="192.168.x.x:8030 or ngrok url">
              </div>
              <div class="col-md-3 d-flex align-items-end">
                <button type="button" class="btn btn-outline-secondary w-100" id="testLocalBtn">Test</button>
              </div>
            </div>
            <div id="localTestResult" class="mt-2"></div>
          </div>
        </div>

        <!-- Online Endpoint -->
        <div class="card mb-3">
          <div class="card-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            Online Endpoint (Convex)
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label for="convexUrl" class="form-label">Convex URL</label>
              <input type="url" class="form-control" id="convexUrl" placeholder="https://your-project.convex.site">
            </div>
            <div class="mb-3">
              <label for="apiKey" class="form-label">API Key</label>
              <input type="password" class="form-control" id="apiKey" placeholder="sms_live_...">
            </div>
            <button type="button" class="btn btn-outline-secondary" id="testOnlineBtn">Test Connection</button>
            <div id="onlineTestResult" class="mt-2"></div>
          </div>
        </div>

        <!-- Save Button -->
        <button type="button" class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
      </div>
    </main>
  </div>

  <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
